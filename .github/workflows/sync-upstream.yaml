name: Propose stable upstream release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'vijayet1/az-pim-cli' && github.ref == 'refs/heads/main' && vars.UPSTREAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: upstream-sync
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build trusted proposal tool
        run: go build -o "$RUNNER_TEMP/fork-automation" ./tools/fork-automation

      - name: Check App configuration
        env:
          APP_ID: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          APP_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" || { echo 'Missing environment variable UPSTREAM_SYNC_APP_ID'; exit 1; }
          test -n "$APP_KEY" || { echo 'Missing environment secret UPSTREAM_SYNC_APP_PRIVATE_KEY'; exit 1; }

      - name: Mint repository-scoped token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: vijayet1
          repositories: az-pim-cli
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Propose release merge without executing candidate code
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          "$RUNNER_TEMP/fork-automation" sync > "$RUNNER_TEMP/upstream-sync.json"
          {
            echo '## Upstream sync proposal'
            jq -r '"State: \(.state)\nUpstream: \(.pin.tag)\nCommit: \(.pin.commit)\nPR: \(.pr_url // "none")"' "$RUNNER_TEMP/upstream-sync.json"
          } >> "$GITHUB_STEP_SUMMARY"
